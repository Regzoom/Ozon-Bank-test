<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>Ozon Bank Progress Bar</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">
        <div class="card">
            <span class="card-label">Progress</span>

            <div class="progress-area">
                <div class="progress-ring" id="progressRing"></div>
            </div>

            <div class="controls-area">
                <div class="control-row">
                    <input class="value-input" type="number" id="valueInput" min="0" max="100" value="60" />
                    <span class="control-label">Value</span>
                </div>

                <div class="control-row">
                    <label class="toggle">
                        <input type="checkbox" id="animateToggle" />
                        <span class="toggle-track"></span>
                        <span class="toggle-thumb"></span>
                    </label>
                    <span class="control-label">Animate</span>
                </div>

                <div class="control-row">
                    <label class="toggle">
                        <input type="checkbox" id="hideToggle" />
                        <span class="toggle-track"></span>
                        <span class="toggle-thumb"></span>
                    </label>
                    <span class="control-label">Hide</span>
                </div>
            </div>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
